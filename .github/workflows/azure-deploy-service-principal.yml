name: Deploy to Azure App Service (Service Principal)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: atlaslabs-app
  DOTNET_VERSION: '10.0.x'
  RESOURCE_GROUP: atlaslabs-rg
  AZURE_REGION: eastus

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore Atlaslabs/Atlaslabs.csproj

    - name: Build
      run: dotnet build Atlaslabs/Atlaslabs.csproj --configuration Release --no-restore

    - name: Test
      run: dotnet test Atlaslabs/Atlaslabs.csproj --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"
      continue-on-error: true

    - name: Publish
      run: dotnet publish Atlaslabs/Atlaslabs.csproj --configuration Release --no-build --output ./publish

    - name: Upload artifact for deployment
      uses: actions/upload-artifact@v4
      with:
        name: webapp-package
        path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    
    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: webapp-package
        path: ./publish

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy to Azure App Service
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        package: ./publish

    - name: Azure Logout
      run: az logout
      if: always()
